name: Shell tests

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  shelltests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
          otp-version: '26.0'
          elixir-version: '1.14'
    - name: Compile
      run: ./bootstrap
    - name: Install
      run: |
        sudo cp ./rebar3 /usr/local/bin/

    - name: Checkout shell tests
      # FIXME: change to original repo before merge.
      run: git clone -b ct/sys-config https://github.com/dmitrivereshchagin/rebar3_tests

    - name: Install and run shelltestrunner
      run: |
        sudo apt-get update
        sudo apt-get install -y shelltestrunner build-essential cmake liblz4-dev
        cd rebar3_tests
        mix local.hex --force
        ./run_tests.sh
